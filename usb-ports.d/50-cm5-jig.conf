# USB port restriction for the CM5 Programming Jig.
#
# Installed to /usr/share/rpi-sb-provisioner/usb-ports.d/50-cm5-jig.conf and
# read by rpi-sb-provisioner (>= 2.3.2) each time a device appears. It limits
# provisioning to the ports named here, so the jig only programs a board that
# is actually seated in its head and ignores anything else attached to the
# host -- a developer's board on a bench cable, a device left connected for
# debugging, a stick in a spare socket.
#
# ---------------------------------------------------------------------------
# This file IS active: installing it restricts provisioning to the port named
# at the bottom. If that port is wrong for your jig, provisioning will stop
# working entirely -- see "Overriding this file" below for how to correct it
# without editing this copy.
# ---------------------------------------------------------------------------
#
# Format
# ------
# One USB topology path per line, in the form the kernel uses for a device
# directory under /sys/bus/usb/devices:
#
#     <bus>-<port>[.<port>...]
#
# Shell globs are permitted, so "1-1.*" covers every downstream port of the
# hub on bus 1 port 1. Blank lines are ignored, as is anything from a '#' to
# the end of a line.
#
# Checking the path for your jig head
# -----------------------------------
# The path belongs to the physical port, not to the board plugged into it, so
# it is stable as boards are swapped through the head and across the USB
# re-enumeration a device performs between the bootstrap and fastboot phases.
#
# Seat a board in the head, press the lever to power it up, and read back what
# the kernel enumerated:
#
#     ls /sys/bus/usb/devices/
#
# Or list only the boards this provisioner would act on:
#
#     for d in /sys/bus/usb/devices/[0-9]*-[0-9]*; do
#         [ -f "$d/idVendor" ] || continue
#         case "$(cat "$d/idVendor"):$(cat "$d/idProduct")" in
#           0a5c:2764|0a5c:2711|0a5c:2712|18d1:4e40)
#             echo "$(basename "$d")" ;;
#         esac
#     done
#
# Ports already used by this provisioner are also on record:
#
#     sudo sqlite3 /srv/rpi-sb-provisioner/state.db \
#          'SELECT DISTINCT endpoint FROM devices;'
#
# Overriding this file
# --------------------
# Files in /etc/rpi-sb-provisioner/usb-ports.d/ take precedence over this one.
# A file of the SAME name replaces this one outright -- that is the upgrade-safe
# way to set the jig's own port, and an empty one disables this file entirely.
# A file of a DIFFERENT name is additive, which is how to permit an extra bench
# port alongside the jig head.
#
# See /usr/share/rpi-sb-provisioner/usb-ports.d/README for the full rules.

# The single head of this jig: bus 4, port 1.
#
# On the CM5 Lite host this is a root port of the second xHCI controller
# (/sys/devices/platform/axi/1000120000.pcie/1f00300000.usb/xhci-hcd.1/usb4),
# wired directly to the head with no intervening hub, so the path is fixed by
# the carrier layout rather than by enumeration order.
#
# Measured on a PVT jig, where it is the only port the provisioner has ever
# seen a board on.
4-1
