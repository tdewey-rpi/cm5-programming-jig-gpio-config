# UART capture for the CM5 Programming Jig.
#
# Installed to /usr/share/rpi-sb-provisioner/uart.d/50-cm5-jig.conf and read
# by rpi-sb-uart-capture (rpi-sb-provisioner 2.4.0 or later) when it starts.
# GPIO 14 and 15 of the host are wired to the console UART of the board in
# the head; cm5-programming-jig-uart.service turns them into /dev/ttyAMA0.
# Everything the board prints is kept with its other logs, and shown on its
# device page.
#
# A same-named file in /etc/rpi-sb-provisioner/uart.d/ replaces this one, and
# an empty one turns capture off. Restart rpi-sb-uart-capture after a change.
# See /usr/share/rpi-sb-provisioner/uart.d/README for the format.

# The head's USB port, as in usb-ports.d/50-cm5-jig.conf, and its UART.
4-1 /dev/ttyAMA0 115200
